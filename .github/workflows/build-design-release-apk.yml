name: Build Mika Release APK (Arabic RTL)
on:
  push:
    branches:
      - design/material3-arabic-rtl
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Test and build signed Release APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 36 SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Prepare persistent release key
        env:
          MIKA_RELEASE_KEYSTORE_BASE64: ${{ secrets.MIKA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$MIKA_RELEASE_KEYSTORE_BASE64" || { echo 'Missing release signing key secret.' >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/mika-signing"
          printf '%s' "$MIKA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mika-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/mika-signing/release.jks"
      - name: Run tests and build signed Release APKs
        env:
          MIKA_SIGNING_KEYSTORE: ${{ runner.temp }}/mika-signing/release.jks
          MIKA_SIGNING_STORE_PASSWORD: ${{ secrets.MIKA_RELEASE_KEYSTORE_PASSWORD }}
          MIKA_SIGNING_KEY_ALIAS: mika-arabic-release
          MIKA_SIGNING_KEY_PASSWORD: ${{ secrets.MIKA_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :core:test :app:testReleaseUnitTest :app:assembleRelease --no-daemon --stacktrace
      - name: Verify package, signature, ABI variants, and checksums
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/release"
          test -s "$APK_DIR/app-universal-release.apk"
          test -s "$APK_DIR/app-arm64-v8a-release.apk"
          mkdir -p dist
          for APK in "$APK_DIR"/*.apk; do
            test -s "$APK"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK" >/dev/null
            BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
            grep -F "package: name='com.mohzh344.mika.ar' versionCode='35' versionName='0.1.33-ar.1'" <<< "$BADGING"
            cp "$APK" dist/
          done
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)
      - name: Upload build artifact (not a public Release)
        uses: actions/upload-artifact@v4
        with:
          name: Mika-design-release-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
