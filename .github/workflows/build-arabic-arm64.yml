name: Mika Arabic ARM64 build

on:
  push:
    branches:
      - arabic-arm64
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build signed ARM64 APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Prepare persistent release key
        env:
          MIKA_RELEASE_KEYSTORE_BASE64: ${{ secrets.MIKA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$MIKA_RELEASE_KEYSTORE_BASE64" || { echo 'Missing release signing key secret.' >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/mika-signing"
          printf '%s' "$MIKA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mika-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/mika-signing/release.jks"

      - name: Run unit tests and build Arabic release APK
        env:
          MIKA_SIGNING_KEYSTORE: ${{ runner.temp }}/mika-signing/release.jks
          MIKA_SIGNING_STORE_PASSWORD: ${{ secrets.MIKA_RELEASE_KEYSTORE_PASSWORD }}
          MIKA_SIGNING_KEY_ALIAS: mika-arabic-release
          MIKA_SIGNING_KEY_PASSWORD: ${{ secrets.MIKA_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :core:test :app:testArabicReleaseUnitTest :app:assembleArabicRelease --no-daemon --stacktrace

      - name: Verify APK identity, signature, and ABI
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/arabicRelease/app-arm64-v8a-arabicRelease.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
          grep -F "package: name='com.mohzh344.mika.ar' versionCode='35' versionName='0.1.33-ar.1'" <<< "$BADGING"
          ABIS="$(unzip -Z1 "$APK" | awk -F/ '$1 == "lib" && NF > 2 { print $2 }' | sort -u)"
          test "$ABIS" = "arm64-v8a"
          mkdir -p dist
          cp "$APK" dist/Mika-v0.1.33-ar.1-arm64.apk
          (cd dist && sha256sum Mika-v0.1.33-ar.1-arm64.apk > SHA256SUMS.txt)

      - name: Upload build artifact (not a public Release)
        uses: actions/upload-artifact@v4
        with:
          name: Mika-v0.1.33-ar.1-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
